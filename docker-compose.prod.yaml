networks:
  private:

services:
  nginx:
    image: nginx:1.29.4-alpine3.23
    container_name: equipment-maintenance-service-nginx
    ports:
      - "80:80"
    volumes:
      - "./nginx/nginx.conf:/etc/nginx/conf.d/default.conf"
    depends_on:
      - app
    networks:
      - private

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: equipment-maintenance-service-app
    env_file:
      - ./.env.prod
    depends_on:
      create-db:
        condition: service_started
    networks:
      - private

  create-db:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: equipment-maintenance-service-create-db
    env_file:
      - ./.env.prod
    command: >
      sh -c "
        npx sequelize-cli db:migrate &&
        npx sequelize-cli db:seed:all
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private

  postgres:
    image: postgres:18.1-bookworm
    container_name: equipment-maintenance-service-postgres
    restart: unless-stopped
    env_file:
      - ./.env.prod

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - private

volumes:
  postgres-data:
