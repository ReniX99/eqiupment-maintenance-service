services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: equipment-maintenance-service-app
    ports:
      - "3000:3000"
    env_file:
      - ./.env.prod
    depends_on:
      create-db:
        condition: service_completed_successfully

  create-db:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: equipment-maintenance-service-create-db
    env_file:
      - ./.env.prod
    command: >
      sh -c "
        npx sequelize-cli db:migrate &&
        npx sequelize-cli db:seed:all
      "
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.1-bookworm
    container_name: equipment-maintenance-service-postgres
    restart: unless-stopped
    ports:
      - "5410:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
